# D题飞行控制参数。雷达、相机和串口等硬件参数使用各自驱动的默认值，
# 不要把硬件驱动参数放进这个文件。

domain_bridge:
  ros__parameters:
    # 飞行闭环所在的本地ROS域。
    local_domain_id: 1
    # 对外发送坐标、状态并接收任务选择的ROS域。
    remote_domain_id: 42
    # Domain 42发布本机坐标的话题，类型Float32MultiArray：[x_cm, y_cm]。
    coordinate_topic: "/drone_position"
    # Domain 42接收任务选择的话题，1=投放，2=降落。
    fly_choice_topic: "/fly_choice"
    # Domain 42发布飞行阶段的话题，类型UInt8，只使用1~5。
    drone_state_topic: "/drone_state"
    # 坐标和飞行阶段的持续发布频率，单位Hz。
    publish_frequency_hz: 10.0
    # 将Domain 1的/tf和/tf_static限频转发到Domain 42，单位Hz。
    tf_publish_frequency_hz: 2.0

height_source_mux:
  ros__parameters:
    # 飞行高度来源：
    # laser_array = 使用4x4面阵激光16束中的最大有效高度；
    # stm32 = 使用STM32的0x05高度帧。
    height_source: "laser_array"

position_pid_controller:
  ros__parameters:
    # PID控制循环频率，单位Hz。
    control_frequency: 50.0

    # 普通航点XY、偏航和高度PID。
    kp_xy: 0.8
    ki_xy: 0.0
    kd_xy: 0.2
    kp_yaw: 1.0
    ki_yaw: 0.0
    kd_yaw: 0.2
    kp_z: 1.0
    ki_z: 0.01
    kd_z: 0.2

    max_linear_velocity: 35.0
    max_angular_velocity: 35.0
    max_vertical_velocity: 35.0

    # AprilTag像素误差对应的视觉XY PID。
    visual_kp_x: 0.09
    visual_ki_x: 0.015
    visual_kd_x: 0.02
    visual_kp_y: 0.09
    visual_ki_y: 0.015
    visual_kd_y: 0.02
    # 这里只是视觉PID的输出死区，不是投放三帧对准的100像素判定值。
    visual_pixel_deadzone: 5.0
    visual_max_xy_velocity: 28.0
    # 每帧视觉速度最多沿用0.2秒，超时后四轴速度严格归零。
    visual_data_timeout_sec: 3.0
    # 视觉跟随下降：高度不低于70cm时最大下降15cm/s。
    visual_descent_max_velocity_cm_s: 15.0
    # 实际高度低于70cm后进入低空慢降，最大下降速度降为8cm/s。
    visual_low_height_threshold_cm: 70.0
    visual_low_height_descent_max_velocity_cm_s: 8.0

route_target_publisher:
  ros__parameters:
    # 普通航点到达容差。
    position_tolerance_cm: 8.0
    height_tolerance_cm: 8.0
    yaw_tolerance_deg: 8.0
    # 仅投放任务使用：实际高度首次进入首航点高度容差后立即开始倒计时；
    # 不等待XY/Yaw到位，计时开始后也不因高度波动而清零。降落任务不等待。
    takeoff_hover_sec: 3.0
    # /fine_data超过该时间未更新即判定视觉丢失。
    fine_data_timeout_sec: 1.0
    # 首次识别Tag后先保持搜索航点高度连续对准，满该时间后开始下降。
    pre_descent_alignment_sec: 1.0

    # 投放PID的目标高度为50cm；实际高度不高于57cm后才允许累计投放对准帧。
    drop_target_height_cm: 50.0
    drop_trigger_height_cm: 57.0
    # 这是投放判定容差：两轴误差连续2个新帧都不超过120px才投放。
    drop_alignment_tolerance_px: 120.0
    drop_alignment_required_frames: 2
    # 降落任务高空对准结束后把高度目标设为28cm，到达后发送停机指令。
    landing_trigger_height_cm: 28.0
    # 降落停机后保持全零速度5秒，再发送重新起飞指令。
    landed_hold_sec: 5.6
    # 投放或降落完成后的固定返航航点。
    # 程序会先在任务实时X/Y/Yaw处爬升到第一个返航航点的高度，再依次执行这些航点。
    post_task_return_waypoints:
      - "(0 0 144 0)"
      - "(0 0 15 0)"
    # 最终返航下降时，实际高度严格低于该值后持续发送[0,0,0,0]目标速度。
    final_landing_stop_height_cm: 21.0
    # 发现Tag后，低于该高度才从伴飞状态2切换为投放3或降落4。
    drone_state_action_height_cm: 80.0

    # 每个航点严格使用"(x_cm y_cm z_cm yaw_deg)"格式。
    # 前normal_count个是普通航点，后面的全部是连续搜索航点。
    # 投放路线：收到/fly_choice=1时加载。
    route_drop_waypoints:
      - "(0 0 144 0)"
      - "(237.5 -37.5 144 0)"
      - "(237.5 -37.5 144 0)"
      - "(290 -65 144 0)"
      - "(312.5 -102.5 144 0)"
      - "(290 -140 144 0)"
      - "(237.5 -187.5 144 0)"
      - "(87.5 -187.5 144 0)"
    route_drop_normal_count: 1

    # 降落路线：收到/fly_choice=2时加载。
    route_land_waypoints:
      - "(0 0 144 0)"
      - "(237.5 -37.5 144 0)"
      - "(237.5 -37.5 144 0)"
      - "(290 -65 144 0)"
      - "(312.5 -102.5 144 0)"
      - "(290 -140 144 0)"
      - "(237.5 -187.5 144 0)"
      - "(87.5 -187.5 144 0)"
    route_land_normal_count: 1
